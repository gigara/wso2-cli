# A context for trying the intg module against the WSO2 Cloud development
# environment. Apply with: ws context apply -f wso2cloud-dev.yaml --use wso2cloud-dev
#
# It logs in at the WSO2 Cloud ThunderID with the public WSO2_CLI client. The
# provider names its own URL as its issuer since 2026-10-28; before that it
# named "platform-idp", which needed login.issuerId (ADR 0020).
#
# The intg product is reached by exchange, which the module's descriptor fills
# in: the login names no resource, and each command exchanges the login token
# (RFC 8693) for one bound to the Integration Platform API, whose resource
# server identifier is the API's URL.
contexts:
  - name: wso2cloud-dev
    type: cloud
    # The project intg commands act within unless --project names another.
    # The platform creates "default" in every organization; change it to work
    # in another project by default.
    project: default
    login:
      kind: oauth-browser
      provider: thunder
      issuer: https://platform-idp-development.gateway.dev.cloud.wso2.com
      clientId: WSO2_CLI
    products:
      intg:
        url: https://development-wso2cloud.gateway.dev.cloud.wso2.com/ipaas-service-ipaas-api-endpoint
        # WSO2 Cloud's observability proxy, which build logs are read from.
        gateway:
          url: https://cloud-obs-proxy.obs.dp.dev.cloud.wso2.com/wso2cloud-obs
